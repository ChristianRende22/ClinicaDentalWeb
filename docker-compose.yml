services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-clinica_dental_web}
    ports:
      - "3306:3306"
    volumes:
      - clinica_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-clinica_dental_web}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?debes definir JWT_SECRET_KEY en .env}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"

volumes:
  clinica_db_data:
